services:
  api:
    build: ./services/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://tecrural:tecrural@db:5432/tecrural
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tecrural
      POSTGRES_PASSWORD: tecrural
      POSTGRES_DB: tecrural
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata: {}
# No verificado localmente (sin Docker en esta máquina). No incluir secretos reales.
